name: register-service-worker

# One-shot: replaces the inline https-only registration with the load-time
# registration used across the suite, then deletes itself in the same push.

on: push

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Register the worker on load
        env:
          PAYLOAD: ""
        run: |
          set -euo pipefail
          echo "$PAYLOAD" | base64 -d | gunzip > /tmp/change.diff
          git apply --whitespace=nowarn /tmp/change.diff
          node --check app.js
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add app.js
          git commit -m "Register the service worker on load with updateViaCache none"
          git rm --quiet .github/workflows/register-service-worker.yml
          git commit -m "Remove the one-shot workflow"
          git push
